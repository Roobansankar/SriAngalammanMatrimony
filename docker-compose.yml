version: "3.9"

x-default-env: &default-env
  environment:
    NODE_ENV: ${NODE_ENV:-production}

services:
  db:
    image: mysql:8.0
    container_name: matrimony-mysql
    restart: always
    command: >-
      --innodb-page-size=32K
      --innodb-default-row-format=DYNAMIC
      --innodb-strict-mode=OFF
    ports:
      - "3307:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-8220}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sriang}
      MYSQL_USER: ${MYSQL_USER:-matrimony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-matrimony}
    volumes:
      - ${MYSQL_DATA_DIR:-./.data/mysql}:/var/lib/mysql
      - ./backend/schema_init/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./backend/schema_init/dump.sql:/docker-entrypoint-initdb.d/01_dump.sql:ro
      - ./backend/schema_init/device_tokens.sql:/docker-entrypoint-initdb.d/02_device_tokens.sql:ro
    networks:
      - matrimony-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: matrimony-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    <<: *default-env
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER:-matrimony}
      DB_PASS: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-8220}}
      DB_NAME: ${MYSQL_DATABASE:-sriang}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
      BASE_URL: ${BASE_URL:-http://localhost:5000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - matrimony-network
    volumes:
      - ./backend/gallery:/app/gallery
      - ./backend/kundli:/app/kundli
      - ./backend/uploads:/app/uploads
      - ./backend/community_certificates:/app/community_certificates

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_BASE: ${REACT_APP_API_BASE:-}
    container_name: matrimony-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      BASE_URL: /api
      API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - matrimony-network

networks:
  matrimony-network:
    driver: bridge

